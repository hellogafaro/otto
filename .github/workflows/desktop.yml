# Otto: Builds the desktop app on demand (Actions → Desktop build → Run workflow) and
# attaches the installers to a draft GitHub Release to publish by hand. macOS is signed
# and notarized when the Developer ID secrets are set; Windows and Linux are unsigned.

name: Desktop build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 DMG
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
          - label: Windows x64 NSIS
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
          - label: Linux x64 AppImage
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        shell: bash
        run: printf 'RELEASE_VERSION=%s\n' "$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_ENV"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8a7496fd44e8a1b0a88a7459e36213b2fefc1d15 # v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@otto/desktop... --filter=otto... --filter=@otto/scripts...

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Check macOS signing credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          values=("$MACOS_CERTIFICATE_P12" "$MACOS_CERTIFICATE_PASSWORD" "$MACOS_SIGNING_IDENTITY" "$APPSTORE_API_KEY_P8" "$APPSTORE_API_KEY_ID" "$APPSTORE_ISSUER_ID")
          present=0
          for value in "${values[@]}"; do test -n "$value" && present=$((present + 1)); done
          if (( present != 0 && present != ${#values[@]} )); then
            printf 'macOS signing credentials must be either complete or absent.\n' >&2
            exit 1
          fi
          signed=false
          if (( present > 0 )); then signed=true; fi
          printf 'MACOS_SIGNED=%s\n' "$signed" >> "$GITHUB_ENV"

      - name: Import macOS signing certificate
        if: matrix.platform == 'mac' && env.MACOS_SIGNED == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Configure macOS notarization
        if: matrix.platform == 'mac' && env.MACOS_SIGNED == 'true'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          case "$MACOS_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) printf 'MACOS_SIGNING_IDENTITY must name a Developer ID Application certificate.\n' >&2; exit 1 ;;
          esac
          printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/notarytool-api-key.p8"
          chmod 600 "$RUNNER_TEMP/notarytool-api-key.p8"
          printf 'CSC_NAME=%s\n' "${MACOS_SIGNING_IDENTITY#Developer ID Application: }" >> "$GITHUB_ENV"

      - name: Build desktop artifact
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notarytool-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          args=(--platform ${{ matrix.platform }} --target ${{ matrix.target }} --arch ${{ matrix.arch }} --build-version "$RELEASE_VERSION" --verbose)
          if test "$MACOS_SIGNED" = true; then args+=(--signed); fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify notarized macOS DMG
        if: matrix.platform == 'mac' && env.MACOS_SIGNED == 'true'
        shell: bash
        run: |
          dmg="release/Otto-Bot-$RELEASE_VERSION-arm64.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Launch macOS DMG
        if: matrix.platform == 'mac'
        run: vp run test:desktop-packaged-mac -- "release/Otto-Bot-$RELEASE_VERSION-arm64.dmg"

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Create draft GitHub Release
        shell: bash
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          gh release create "v$version-build.$GITHUB_RUN_NUMBER" release/* --target "$GITHUB_SHA" --title "Otto $version (build $GITHUB_RUN_NUMBER)" --draft --generate-notes
