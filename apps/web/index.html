<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/apple-touch-icon.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        let dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          const mode =
            window.localStorage.getItem("otto:theme-appearance-mode") ??
            window.localStorage.getItem("ottoLegacy:theme-appearance-mode");
          const legacy =
            window.localStorage.getItem("otto:theme") ??
            window.localStorage.getItem("ottoLegacy:theme");
          if (mode === "dark" || mode === "light") dark = mode === "dark";
          else if (mode !== "system") {
            const follow =
              window.localStorage.getItem("otto:theme-follow-system") ??
              window.localStorage.getItem("ottoLegacy:theme-follow-system");
            if (follow !== "true" && (legacy === "dark" || legacy === "light"))
              dark = legacy === "dark";
            else if (follow === "false") dark = false;
          }
        } catch {}
        const root = document.documentElement;
        const background = dark ? "oklch(0.1466 0.0015 286.15)" : "oklch(0.9431 0.0006 286.15)";
        root.classList.toggle("dark", dark);
        root.style.backgroundColor = background;
        root.style.setProperty("--boot-background", background);
        root.style.setProperty(
          "--boot-foreground",
          dark ? "oklch(0.9702 0.0006 286.15)" : "oklch(0.2334 0.0018 286.15)",
        );
        root.dataset.themeSelected = "true";
        for (const meta of document.querySelectorAll('meta[name="theme-color"]'))
          meta.content = background;
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: oklch(0.9431 0.0006 286.15);
        color: #262626;
        font-family: Inter, system-ui, sans-serif;
      }

      html.dark body {
        background: oklch(0.1466 0.0015 286.15);
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 36px;
        height: 36px;
        border-radius: var(--control-radius, 8px);
        opacity: 0.1;
        filter: brightness(0) invert(1);
        object-fit: contain;
      }
    </style>
    <title>Otto</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Otto splash screen">
          <img id="boot-shell-logo" src="/otto-logo.svg" alt="Otto" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
