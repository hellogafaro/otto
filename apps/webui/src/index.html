<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Otto</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060606" media="(prefers-color-scheme: dark)" />
  <!-- The saved theme (theme-context.tsx, localStorage otto-theme) before first paint, so the loader and the app agree. -->
  <script>try{var m=(JSON.parse(localStorage.getItem('otto-theme'))||{}).mode}catch(e){}if(m!=='light'&&m!=='dark')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.remove('light','dark');document.documentElement.classList.add(m)</script>
</head>
<body>
  <div id="root">
    <style>
      #_loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:oklch(1 0 0); --deboss-ink:color-mix(in srgb, oklch(0.145 0 0) 35%, oklch(1 0 0)); --deboss-shadow:rgb(0 0 0/0.45); --deboss-rim:rgb(255 255 255/0.9); --deboss-hi:transparent; }
      #_loader svg { width:40px; height:auto; overflow:visible; color:var(--deboss-ink); animation:_fade 0.3s ease-out; }
      @keyframes _fade { from { opacity:0 } }
      .dark #_loader { background:oklch(0.17 0 0); --deboss-ink:color-mix(in srgb, oklch(0.985 0 0) 28%, oklch(0.17 0 0)); --deboss-shadow:rgb(0 0 0/0.75); --deboss-rim:rgb(255 255 255/0.35); --deboss-hi:rgb(255 255 255/0.14); }
    </style>
    <!-- The debossed mark of the splash (splash-screen.tsx), same filter and values, so loader and splash read as one screen. -->

50.88 170.556C235.179 115.206 201.85 66.4879 155.951 31.7971L106.132 97.7121C137.686 121.561 160.598 155.052 171.392 193.103C182.185 231.154 180.27 271.688 165.937 308.552L242.945 338.493Z"/><path d="M283.174 238.874C340.038 230.117 392.493 203.049 432.578 161.777C472.663 120.505 498.19 67.2822 505.283 10.1867L423.29 0C418.413 39.2506 400.865 75.8389 373.308 104.212C345.752 132.584 309.691 151.193 270.599 157.212L283.174 238.874Z"/><path d="M389.561 223.903C425.576 268.771 475.246 300.664 531.031 314.743C586.816 328.822 645.672 324.317 698.664 301.912L666.49 225.81C630.059 241.213 589.599 244.309 551.249 234.631C512.899 224.953 478.753 203.027 453.995 172.183L389.561 223.903Z"/></svg></div>
  </div>

</body>
</html>
