<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Otto</title>
  <link rel="icon" href="./favicon.ico" sizes="32x32" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060606" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500&display=swap" rel="stylesheet">
  <style>
    /* Otto tokens, copied from design/ui/src/styles/globals.css (:root and .dark).
       This page is static HTML served before sign-in, so it cannot load the app
       stylesheet. No card: the form sits on the page layer (--background). */
    :root {
      color-scheme: light dark;
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --primary: oklch(0.546 0.245 262.881);
      --primary-foreground: oklch(0.985 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --text-xs: 0.75rem;
      --text-sm: 0.8125rem;
      --text-base: calc(var(--text-sm) * 1.272);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.17 0 0);
        --foreground: oklch(0.985 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --primary: oklch(0.623 0.214 259.815);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.556 0 0);
        --destructive: oklch(0.704 0.191 22.216);
      }
    }

    @media (width < 48rem) {
      :root { --text-sm: 0.875rem; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      background: var(--background);
      color: var(--foreground);
      font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--text-sm);
      line-height: 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    /* Narrow left-aligned column, no card. */
    main {
      width: 100%;
      max-width: 21rem;
    }

    /* App icon tile: 40px, 9px corners (22.37% of the side, the iOS icon radius). */
    .app-icon {
      display: block;
      width: 40px;
      height: 40px;
      margin-bottom: 20px;
      border-radius: 9px;
      box-shadow: 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent);
    }

    /* Heading token: text-base, 24px line, weight 500. */
    h1 {
      font-size: var(--text-base);
      line-height: 1.5rem;
      font-weight: 500;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted-foreground);
    }

    form { margin-top: 20px; }

    /* Field: 32px, solid bg-input/50, 8px radius, no focus ring (the caret shows
       focus). The bare input and the 28px eye button sit inside it, so the 6px
       button corners nest in the 8px field. */
    .field {
      display: flex;
      align-items: center;
      height: 32px;
      padding-right: 2px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: color-mix(in oklab, var(--input) 50%, transparent);
      transition: background-color 0.15s, border-color 0.15s;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 12px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      font-size: var(--text-sm);
    }

    input::placeholder { color: var(--muted-foreground); }

    /* Failed sign-in: destructive/10 fill and border (destructive/20 fill and
       destructive/50 border in dark). */
    form:has(.error.visible) .field {
      border-color: var(--destructive);
      background: color-mix(in oklab, var(--destructive) 10%, transparent);
    }

    @media (prefers-color-scheme: dark) {
      form:has(.error.visible) .field {
        border-color: color-mix(in oklab, var(--destructive) 50%, transparent);
        background: color-mix(in oklab, var(--destructive) 20%, transparent);
      }
    }

    button {
      border: 1px solid transparent;
      outline: none;
      font: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    button:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring) 30%, transparent);
    }

    /* Ghost icon button: 28px, 6px radius, muted, foreground/5 on hover. It does
       not move on press. */
    .toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-foreground);
    }

    .toggle:hover {
      background: color-mix(in oklab, var(--foreground) 5%, transparent);
      color: var(--foreground);
    }

    .toggle svg { width: 14px; height: 14px; }
    .toggle .hide, .toggle[aria-pressed="true"] .show { display: none; }
    .toggle[aria-pressed="true"] .hide { display: block; }

    /* Primary button: 32px, 8px radius, hover primary/80. */
    .submit {
      width: 100%;
      height: 32px;
      margin-top: 12px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .submit:hover { background: color-mix(in oklab, var(--primary) 80%, transparent); }
    .submit:active { transform: translateY(1px); }

    .submit:disabled {
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
    }

    .error {
      display: none;
      margin-top: 8px;
      color: var(--destructive);
      font-size: var(--text-xs);
      line-height: 1rem;
    }

    .error.visible { display: block; }

    /* Inputs are at least 16px on phones (iOS zooms below that). */
    @media (width < 48rem) {
      input { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <img class="app-icon" src="/login-assets/otto-app-icon.png" width="40" height="40" alt="">
    <h1>Sign in to Otto</h1>
    <p class="subtitle">Enter the server password to continue.</p>

    <form id="login-form">
      <div class="field">
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Server password"
          aria-label="Server password"
          autocomplete="current-password"
          autofocus
          required
        >
        <button type="button" id="toggle-btn" class="toggle" aria-label="Show password" aria-pressed="false">
          <svg class="show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
        </button>
      </div>
      <div id="error" class="error" role="alert"></div>
      <button type="submit" id="submit-btn" class="submit">Sign in</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const passwordEl = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-btn');

    toggleBtn.addEventListener('click', () => {
      const show = passwordEl.type === 'password';
      passwordEl.type = show ? 'text' : 'password';
      toggleBtn.setAttribute('aria-pressed', String(show));
      toggleBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      passwordEl.focus();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const password = passwordEl.value;
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          // Cookie is set by the response — redirect to app
          window.location.href = '/';
          return;
        }

        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Authentication failed';
        errorEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
