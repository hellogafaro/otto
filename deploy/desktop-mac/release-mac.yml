# Optional release workflow. It is not active here: copy it to .github/workflows/release-mac.yml
# after adding the secrets listed in deploy/desktop-mac/README.md.

name: Release macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish to hellogafaro/otto-releases
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@8a7496fd44e8a1b0a88a7459e36213b2fefc1d15 # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --frozen-lockfile --filter=@otto/desktop... --filter=otto... --filter=@otto/scripts...

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Write App Store Connect API key
        shell: bash
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/notarytool-api-key.p8"
          chmod 600 "$RUNNER_TEMP/notarytool-api-key.p8"

      - name: Build, notarize and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OTTO_RELEASES_TOKEN }}
          APPLE_API_KEY: ${{ runner.temp }}/notarytool-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: bash scripts/release-desktop-mac.sh
