services:
  otto:
    image: ${OTTO_IMAGE:-otto-remote:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:3773:3773"
    environment:
      OTTO_LEGACY_MODE: web
      OTTO_LEGACY_HOST: 0.0.0.0
      OTTO_LEGACY_PORT: 3773
      OTTO_LEGACY_NO_BROWSER: "true"
      OTTO_HOME: /data
    volumes:
      - otto-data:/data
      - ${OTTO_WORKSPACE:-$HOME}:/workspace
    restart: unless-stopped
volumes:
  otto-data:
    name: ${OTTO_DATA_VOLUME:-otto-data}
