# One Otto container serving the app and API on port 3773, all state in the otto-data volume.
# Optional HTTPS: OTTO_DOMAIN=otto.example.com OTTO_TRUST_PROXY=1 docker compose --profile https up -d
services:
  otto:
    image: ${OTTO_IMAGE:-otto:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      OTTO_PUBLIC_ORIGIN: ${OTTO_PUBLIC_ORIGIN:?Set the https origin people open, e.g. https://otto.example.com}
      OTTO_SECRETS_KEY: ${OTTO_SECRETS_KEY:?Set a key from openssl rand -base64 32}
      BOAT_API_KEY: ${BOAT_API_KEY:-}
      OTTO_TRUST_PROXY: ${OTTO_TRUST_PROXY:-}
      OTTO_SMTP_HOST: ${OTTO_SMTP_HOST:-}
      OTTO_SMTP_PORT: ${OTTO_SMTP_PORT:-587}
      OTTO_SMTP_SECURE: ${OTTO_SMTP_SECURE:-false}
      OTTO_SMTP_USER: ${OTTO_SMTP_USER:-}
      OTTO_SMTP_PASSWORD: ${OTTO_SMTP_PASSWORD:-}
      OTTO_MAIL_FROM: ${OTTO_MAIL_FROM:-}
    ports:
      - "${OTTO_HTTP_BIND:-127.0.0.1}:${OTTO_HTTP_PORT:-3773}:3773"
    volumes:
      - otto-data:/data
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: caddy:2.10
    profiles: [https]
    command: caddy reverse-proxy --from ${OTTO_DOMAIN:-localhost} --to otto:3773
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on: [otto]
    restart: unless-stopped

volumes:
  otto-data:
    name: ${OTTO_DATA_VOLUME:-otto-data}
  caddy-data:
