# Single-node qualification profile. No redundancy; secrets are injected in env.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1
consistency_mode = "consistent"
metadata_fsync = true
data_fsync = true
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"
[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
